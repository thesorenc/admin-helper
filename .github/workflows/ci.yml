name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref (a PR push mid-run kills the older run).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Vault absent in CI; --check skips drift and validates the committed JSON/index.
      - run: npm run build:content -- --check
      - run: npm run build # tsc -b (typecheck) + vite build
      # Prod-only supply-chain gate: blocks ONLY on high/critical advisories in
      # dependencies that actually ship to the browser. Dev/build-tool advisories
      # are surfaced by the scheduled security-audit workflow, not here, so an
      # unrelated devDep advisory can't red a code PR. Non-shipping for a static
      # site, so keep it last (never masks lint/test/build signal).
      - run: npm audit --omit=dev --audit-level=high
